# Sync this GitHub repo to the Hugging Face Space on every push to main.
# The Space (Shreshthaa15/FundRadarV2) becomes a mirror of GitHub's main branch,
# so any change you push here is rebuilt and reflected on the live site.
#
# One-time setup (Settings > Secrets and variables > Actions > New repository secret):
#   HF_TOKEN     a Hugging Face WRITE access token for an account that can write
#                to the Space  (huggingface.co/settings/tokens)
#   HF_USERNAME  that account's Hugging Face username
name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:        # also lets you run it by hand from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history is required to push to the Space
          lfs: true

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          git push --force \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/Shreshthaa15/FundRadarV2" \
            HEAD:main
