# Render.com deployment blueprint for FundRadar.
# Render reads this file automatically when you create a "Blueprint" from your repo.
services:
  - type: web
    name: fundradar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Boot from the scraped snapshot committed by the GitHub Action (if any),
    # then seed (idempotent) and start the web server.
    startCommand: >-
      sh -c "if [ -f data/fundradar.db ]; then cp data/fundradar.db fundradar.db; fi &&
      python -m app.ingest.seed_agencies &&
      python -m app.ingest.load_demo_opportunities &&
      python -m app.ingest.seed_demo_user &&
      uvicorn app.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: LLM_PROVIDER
        value: mock
      # Sign the login tokens with a strong random value that Render generates
      # and keeps secret, instead of the insecure development default.
      - key: JWT_SECRET
        generateValue: true
      # Render always serves over HTTPS, so the login cookie should refuse to
      # travel over plain HTTP. (Stays false locally — see .env.example.)
      - key: COOKIE_SECURE
        value: "true"
      # Optional: paste an OAuth Client ID here (or in the Render dashboard) to
      # switch on the "Continue with Google" button. Blank = button hidden and
      # email/password login is completely unaffected. See GOOGLE_SIGNIN_SETUP.md
      - key: GOOGLE_CLIENT_ID
        value: ""
