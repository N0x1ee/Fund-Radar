<!DOCTYPE html>
<html lang="en" class="">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>FundRadar — Funding Opportunity Intelligence Platform</title>
<meta name="description" content="FundRadar — AI-powered platform that discovers, scrapes, extracts and serves funding opportunities from many agencies."/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      colors: { brand: {
  50: '#f0fdf4',
  100: '#dcfce7',
  200: '#bbf7d0',
  300: '#86efac',
  400: '#4ade80',
  500: '#16a34a',
  600: '#15803d',
  700: '#166534',
  800: '#166534',
  900: '#14532d'
},
accent: {
  50: '#eff6ff',
  100: '#dbeafe',
  200: '#bfdbfe',
  300: '#93c5fd',
  400: '#60a5fa',
  500: '#3b82f6',
  600: '#2563eb',
  700: '#1d4ed8',
  800: '#1e40af',
  900: '#1e3a8a'
}
},
fontFamily: {
  sans: ['Inter', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif']
}
    }
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html{scroll-behavior:smooth}
  body{font-family:'Inter',sans-serif}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:6px}
  .dark ::-webkit-scrollbar-thumb{background:#475569}
  [data-route]{cursor:pointer}
  .fade{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-200 antialiased">

<div class="flex min-h-screen">
  <!-- Sidebar -->
  <aside id="sidebar" class="fixed z-40 inset-y-0 left-0 w-64 -translate-x-full lg:translate-x-0 transition-transform
         bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col">
    <div class="px-5 h-16 flex items-center gap-2 border-b border-slate-200 dark:border-slate-800">
      <div class="h-9 w-9 rounded-lg bg-gradient-to-br from-brand-600 to-accent-600 grid place-items-center text-white font-extrabold">F</div>
      <div>
        <div class="font-extrabold tracking-tight leading-none">FundRadar</div>
        <div class="text-[11px] text-slate-400">Funding Intelligence</div>
      </div>
    </div>
    <nav id="nav" class="flex-1 overflow-y-auto p-3 space-y-1 text-sm"></nav>
    <div class="p-3 border-t border-slate-200 dark:border-slate-800 text-[11px] text-slate-400">
      <div>Phase 0–1 complete · 2–5 in progress</div>
      <div class="mt-1">v0.1.0 · demo build</div>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 lg:ml-64 min-w-0">
    <!-- Topbar -->
    <header class="sticky top-0 z-30 h-16 bg-white/80 dark:bg-slate-900/80 backdrop-blur border-b border-slate-200 dark:border-slate-800
                   flex items-center gap-3 px-4 sm:px-6">
      <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">☰</button>
      <h1 id="pageTitle" class="font-semibold text-base sm:text-lg truncate">Dashboard</h1>
      <div class="ml-auto flex items-center gap-2 sm:gap-3">
        <span id="lastUpdated" class="hidden sm:inline text-xs text-slate-400"></span>
        <span id="liveDot" class="inline-flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full
              bg-emerald-50 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300">
          <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>Live API</span>
        <button onclick="toggleTheme()" id="themeBtn" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800" title="Toggle theme">🌙</button>
      </div>
    </header>

    <main id="view" class="p-4 sm:p-6 max-w-[1400px] mx-auto"></main>
    <footer class="px-6 py-8 text-center text-xs text-slate-400">
      FundRadar · Funding Opportunity Intelligence Platform · data served live from the FastAPI backend
    </footer>
  </div>
</div>
<div id="backdrop" onclick="toggleSidebar()" class="hidden fixed inset-0 bg-black/40 z-30 lg:hidden"></div>

<script>
/* ---------------- Navigation ---------------- */
const ROUTES = [
  ['dashboard','Dashboard','M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z'],
  ['agencies','Funding Agencies','M4 21V7l8-4 8 4v14M9 21v-6h6v6'],
  ['opportunities','Funding Opportunities','M3 7h18M3 12h18M3 17h18'],
  ['scrapers','Scraper Status','M12 2a10 10 0 100 20 10 10 0 000-20zm0 4v6l4 2'],
  ['database','Database','M12 3c4.97 0 9 1.79 9 4s-4.03 4-9 4-9-1.79-9-4 4.03-4 9-4zm9 4v10c0 2.21-4.03 4-9 4s-9-1.79-9-4V7'],
  ['api','API','M8 9l-4 3 4 3m8-6l4 3-4 3M14 5l-4 14'],
  ['progress','Project Progress','M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11'],
  ['about','About','M12 9v4m0 4h.01M12 2a10 10 0 100 20 10 10 0 000-20z'],
];
function buildNav(){
  document.getElementById('nav').innerHTML = ROUTES.map(([id,label,d])=>`
    <a data-route="${id}" onclick="go('${id}')" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg
       text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
      <svg class="h-[18px] w-[18px] shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="${d}"/></svg>
      <span>${label}</span>
    </a>`).join('');
}
function setActive(id){
  document.querySelectorAll('.nav-item').forEach(a=>{
    const on = a.getAttribute('data-route')===id;
    a.classList.toggle('bg-brand-50', on); a.classList.toggle('dark:bg-brand-600/20', on);
    a.classList.toggle('text-brand-700', on); a.classList.toggle('dark:text-brand-300', on);
    a.classList.toggle('font-semibold', on);
  });
  const label = (ROUTES.find(r=>r[0]===id)||[])[1] || 'Dashboard';
  document.getElementById('pageTitle').textContent = label;
}
function go(id){ location.hash = '#/'+id; }
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('backdrop').classList.toggle('hidden'); }

/* ---------------- Theme ---------------- */
function applyTheme(t){ document.documentElement.classList.toggle('dark', t==='dark'); document.getElementById('themeBtn').textContent = t==='dark'?'☀️':'🌙'; }
function toggleTheme(){ const t = document.documentElement.classList.contains('dark')?'light':'dark'; localStorage.setItem('fr_theme',t); applyTheme(t); rerenderCharts(); }
applyTheme(localStorage.getItem('fr_theme')|| (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));

/* ---------------- Data ---------------- */
const STATE = { stats:null, ag:[], opp:[], scr:null, agmap:{}, loaded:false, err:null };
async function jget(u){ const r = await fetch(u); if(!r.ok) throw new Error(u+' → '+r.status); return r.json(); }
async function loadAll(){
  try{
    const [stats, a, o, scr] = await Promise.all([
      jget('/stats'), jget('/agencies?limit=500'), jget('/opportunities?limit=500'), jget('/scrapers')
    ]);
    STATE.stats = stats; STATE.ag = a.items||[]; STATE.opp = o.items||[]; STATE.scr = scr;
    STATE.ag.forEach(x=>STATE.agmap[x.id]={name:x.name,country:x.country,code:x.agency_code,category:x.category,funding_type:x.funding_type});
    STATE.opp = STATE.opp.map(o=>({ ...o,
      agency:(STATE.agmap[o.agency_id]||{}).name||'—',
      country:(STATE.agmap[o.agency_id]||{}).country||'—',
      category:(STATE.agmap[o.agency_id]||{}).category||'—',
      funding_type:(STATE.agmap[o.agency_id]||{}).funding_type||'—' }));
    STATE.loaded = true;
    const lu = stats.last_updated ? new Date(stats.last_updated) : null;
    document.getElementById('lastUpdated').textContent = lu ? 'Updated '+lu.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
  }catch(e){ STATE.err = e.message; document.getElementById('liveDot').innerHTML='<span class="h-2 w-2 rounded-full bg-rose-500"></span>API offline'; document.getElementById('liveDot').className='inline-flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full bg-rose-50 text-rose-700 dark:bg-rose-900/40 dark:text-rose-300'; }
}

/* ---------------- Helpers ---------------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtDate(d){ if(!d) return '<span class="text-slate-400">—</span>'; const dt=new Date(d); return isNaN(dt)?esc(d):dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDT(d){ if(!d) return '—'; const dt=new Date(d); return isNaN(dt)?esc(d):dt.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function amount(o){ if(o.funding_amount) return esc(o.funding_amount); if(o.amount_value) return esc((o.currency||'')+' '+Number(o.amount_value).toLocaleString()); return '<span class="text-slate-400">—</span>'; }
function statusBadge(s){ s=s||'unknown'; const m={open:'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300',closed:'bg-slate-200 text-slate-600 dark:bg-slate-700 dark:text-slate-300',unknown:'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300'}; return `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${m[s]||m.unknown}">${esc(s)}</span>`; }
function card(cls=''){ return `bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl ${cls}`; }
function linkBtn(href,txt){ return href?`<a href="${esc(href)}" target="_blank" rel="noopener" class="text-brand-600 dark:text-brand-400 hover:underline font-medium">${txt} ↗</a>`:'<span class="text-slate-400">—</span>'; }
function uniq(arr){ return [...new Set(arr.filter(Boolean))].sort(); }
const CH_TXT = ()=> document.documentElement.classList.contains('dark') ? '#cbd5e1' : '#475569';
const CH_GRID= ()=> document.documentElement.classList.contains('dark') ? 'rgba(148,163,184,.15)' : 'rgba(100,116,139,.15)';
const PALETTE=['#6366f1','#22c55e','#f59e0b','#ef4444','#06b6d4','#a855f7','#ec4899','#14b8a6','#eab308','#3b82f6','#f97316','#84cc16'];

/* ---------------- Charts registry ---------------- */
let CHARTS=[];
function mkChart(ctx,cfg){ const c=new Chart(ctx,cfg); CHARTS.push(c); return c; }
function clearCharts(){ CHARTS.forEach(c=>{try{c.destroy()}catch(e){}}); CHARTS=[]; }
let _currentRoute='dashboard';
function rerenderCharts(){ render(_currentRoute); }

/* ============================================================
   PAGES
   ============================================================ */
function statCard(label,value,sub,accent){
  return `<div class="${card('p-5')}">
    <div class="flex items-center justify-between">
      <div class="text-3xl font-extrabold tracking-tight">${value}</div>
      <div class="h-9 w-9 rounded-lg ${accent} grid place-items-center text-white text-sm font-bold">${label[0]}</div>
    </div>
    <div class="mt-1 text-sm text-slate-500 dark:text-slate-400">${label}</div>
    ${sub?`<div class="mt-2 text-xs text-slate-400">${sub}</div>`:''}
  </div>`;
}

function pageDashboard(){
  const s = STATE.stats||{};
  const v = `
  <div class="fade space-y-6">
    <!-- hero -->
    <div class="rounded-2xl bg-gradient-to-br from-brand-600 via-brand-700 to-accent-600 text-white p-6 sm:p-8 shadow-lg">
      <div class="text-xs uppercase tracking-widest text-brand-100/80 font-semibold">AI-powered Funding Opportunity Intelligence</div>
      <h2 class="mt-2 text-2xl sm:text-3xl font-extrabold">FundRadar</h2>
      <p class="mt-2 max-w-2xl text-white/90 text-sm sm:text-base">Automatically discovers, scrapes, extracts, stores and monitors grants, fellowships, scholarships and research calls from dozens of funding agencies — and serves them through an API and a chatbot.</p>
      <div class="mt-4 flex flex-wrap gap-2 text-xs">
        <span class="px-3 py-1 rounded-full bg-white/15">FastAPI</span>
        <span class="px-3 py-1 rounded-full bg-white/15">SQLAlchemy</span>
        <span class="px-3 py-1 rounded-full bg-white/15">Pluggable LLM (Gemini/Ollama/Mock)</span>
        <span class="px-3 py-1 rounded-full bg-white/15">Polite scraper</span>
      </div>
    </div>

    <!-- stat cards -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      ${statCard('Funding Agencies', s.agencies??'—','Seeded from master database','bg-brand-600')}
      ${statCard('Opportunities', s.opportunities??'—',(s.open??0)+' open · '+(s.closed??0)+' closed','bg-emerald-600')}
      ${statCard('Countries / Blocs', s.countries??'—','Geographic coverage','bg-cyan-600')}
      ${statCard('Categories', s.categories??'—','Research & funding domains','bg-violet-600')}
    </div>

    <!-- charts -->
    <div class="grid lg:grid-cols-3 gap-4">
      <div class="${card('p-5')}"><div class="font-semibold mb-3">Opportunity status</div><div class="h-56"><canvas id="cStatus"></canvas></div></div>
      <div class="${card('p-5 lg:col-span-2')}"><div class="font-semibold mb-3">Agencies by country</div><div class="h-56"><canvas id="cCountry"></canvas></div></div>
    </div>
    <div class="grid lg:grid-cols-2 gap-4">
      <div class="${card('p-5')}"><div class="font-semibold mb-3">Top categories</div><div class="h-64"><canvas id="cCat"></canvas></div></div>
      <div class="${card('p-5')}"><div class="font-semibold mb-3">Funding types</div><div class="h-64"><canvas id="cType"></canvas></div></div>
    </div>

    <!-- chatbot + meta -->
    <div class="grid lg:grid-cols-3 gap-4">
      <div class="${card('p-5 lg:col-span-2')}">
        <div class="font-semibold mb-1">Ask FundRadar</div>
        <div class="text-xs text-slate-400 mb-3">Plain-English questions answered from the live funding database.</div>
        <div class="flex gap-2">
          <input id="chatq" placeholder="e.g. What grants are open now?" onkeydown="if(event.key==='Enter')askBot()"
            class="flex-1 px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"/>
          <button onclick="askBot()" class="px-4 py-2 rounded-lg bg-gradient-to-r from-brand-600 to-accent-600 hover:opacity-90 text-white text-sm font-semibold">Ask</button>
        </div>
        <div class="flex flex-wrap gap-2 mt-3">
          ${['What grants are open now?','Fellowships for PhD students','Funding above 10 lakh','Opportunities in Germany','Biotech startup funding'].map(q=>`<button onclick="ask('${q}')" class="text-xs px-3 py-1.5 rounded-full bg-brand-50 dark:bg-brand-600/20 text-brand-700 dark:text-brand-300 hover:bg-brand-100">${q}</button>`).join('')}
        </div>
        <div id="chatout" class="hidden mt-4 text-sm whitespace-pre-wrap leading-relaxed bg-slate-50 dark:bg-slate-800/60 border-l-4 border-brand-500 rounded-lg p-4"></div>
      </div>
      <div class="${card('p-5')}">
        <div class="font-semibold mb-3">System status</div>
        <ul class="space-y-2.5 text-sm">
          <li class="flex justify-between"><span class="text-slate-500">Database</span><span class="font-medium">SQLite (live)</span></li>
          <li class="flex justify-between"><span class="text-slate-500">Processed records</span><span class="font-medium">${s.processed??0} / ${s.opportunities??0}</span></li>
          <li class="flex justify-between"><span class="text-slate-500">Agencies w/ data</span><span class="font-medium">${s.with_opportunities??0} / ${s.agencies??0}</span></li>
          <li class="flex justify-between"><span class="text-slate-500">Scraper targets</span><span class="font-medium">${(STATE.scr&&STATE.scr.engine.total_targets)||0}</span></li>
          <li class="flex justify-between"><span class="text-slate-500">Last updated</span><span class="font-medium">${fmtDate(s.last_updated)}</span></li>
        </ul>
        <div class="mt-4 pt-4 border-t border-slate-200 dark:border-slate-800">
          <div class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-2">Coming soon</div>
          <div class="grid grid-cols-2 gap-2">
            ${['Vector search','Email alerts','React frontend','Change-log audit'].map(f=>`<div class="text-xs px-2 py-2 rounded-lg border border-dashed border-slate-300 dark:border-slate-700 text-slate-400 text-center">${f}</div>`).join('')}
          </div>
        </div>
      </div>
    </div>
  </div>`;
  $('#view').innerHTML = v;
  // charts
  const sb = s.status_breakdown||{};
  mkChart($('#cStatus'),{type:'doughnut',data:{labels:Object.keys(sb),datasets:[{data:Object.values(sb),backgroundColor:['#22c55e','#94a3b8','#f59e0b']}]},options:{plugins:{legend:{position:'bottom',labels:{color:CH_TXT()}}},maintainAspectRatio:false}});
  const cb = s.countries_breakdown||{};
  mkChart($('#cCountry'),{type:'bar',data:{labels:Object.keys(cb),datasets:[{data:Object.values(cb),backgroundColor:'#6366f1',borderRadius:4}]},options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:CH_TXT(),maxRotation:60,minRotation:45,font:{size:9}},grid:{display:false}},y:{ticks:{color:CH_TXT(),stepSize:5},grid:{color:CH_GRID()}}},maintainAspectRatio:false}});
  const catb = s.categories_breakdown||{};
  mkChart($('#cCat'),{type:'bar',data:{labels:Object.keys(catb),datasets:[{data:Object.values(catb),backgroundColor:PALETTE}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{ticks:{color:CH_TXT(),stepSize:1},grid:{color:CH_GRID()}},y:{ticks:{color:CH_TXT(),font:{size:10}},grid:{display:false}}},maintainAspectRatio:false}});
  const tb = s.funding_types_breakdown||{};
  mkChart($('#cType'),{type:'polarArea',data:{labels:Object.keys(tb),datasets:[{data:Object.values(tb),backgroundColor:PALETTE}]},options:{plugins:{legend:{position:'right',labels:{color:CH_TXT(),font:{size:10}}}},scales:{r:{ticks:{display:false},grid:{color:CH_GRID()}}},maintainAspectRatio:false}});
}

/* ----- Agencies ----- */
/* Filter + sort state. Client-side: all agencies are already in STATE.ag and
   the per-agency opportunity count comes from STATE.opp, so filtering is
   instant and needs no extra API round-trip. The same criteria are also
   supported server-side (see the /agencies query params on the API page).   */
const AGF_DEFAULTS = {q:'',country:'',category:'',funding_type:'',availability:'',sort:'agency_code',dir:1};
const AGF = {...AGF_DEFAULTS};

/* value = "<field>:<direction>"  ->  label shown in the Sort by dropdown */
const AG_SORTS = [
  ['agency_code:1',  'Agency code (default)'],
  ['name:1',         'Name — A → Z'],
  ['name:-1',        'Name — Z → A'],
  ['country:1',      'Country — A → Z'],
  ['nopp:-1',        'Most opportunities'],
  ['nopp:1',         'Fewest opportunities'],
  ['relevance:-1',   'Best match (search)'],
];
const AG_COLS = {agency_code:'Code',name:'Agency',country:'Country',category:'Category',funding_type:'Funding Type',status:'Status',nopp:'Opps'};
const AG_FIELD_LABELS = {q:'Search',country:'Country',category:'Category',funding_type:'Funding Type',availability:'Availability'};
const AG_AVAIL = [['has','With opportunities'],['none','None yet (monitored)']];

function agActive(){ return ['q','country','category','funding_type','availability'].filter(k=>AGF[k]); }
function agSetSort(v){ const [f,d]=v.split(':'); AGF.sort=f; AGF.dir=Number(d); renderAgencies(); }
function agSet(k,v){ AGF[k]=v; renderAgencies(); }
function agClear(k){ AGF[k]=AGF_DEFAULTS[k]; pageAgencies(); }
function agResetFilters(){ Object.assign(AGF, AGF_DEFAULTS); pageAgencies(); }

function pageAgencies(){
  const countries = uniq(STATE.ag.map(a=>a.country));
  const cats      = uniq(STATE.ag.map(a=>a.category));
  const ftypes    = uniq(STATE.ag.map(a=>a.funding_type));
  const ctl  = 'w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500';
  const lbl  = 'block text-[11px] font-semibold uppercase tracking-wide text-slate-400 mb-1.5';
  const opts = (list, sel) => list.map(c=>`<option value="${esc(c)}" ${sel===c?'selected':''}>${esc(c)}</option>`).join('');

  $('#view').innerHTML = `
  <div class="fade space-y-4">

    <!-- ===== Filter / Sort panel ===== -->
    <section class="${card('overflow-hidden')}">
      <div class="flex items-center gap-3 px-4 sm:px-5 py-3 border-b border-slate-200 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-800/40">
        <div class="h-8 w-8 shrink-0 rounded-lg bg-brand-600/10 text-brand-600 dark:text-brand-400 grid place-items-center">
          <svg class="h-[18px] w-[18px]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 5h18M6 12h12M10 19h4"/></svg>
        </div>
        <div class="min-w-0">
          <h2 class="font-semibold text-sm leading-tight">Filter &amp; Sort Agencies</h2>
          <p class="hidden sm:block text-[11px] text-slate-400 mt-0.5">Select criteria below to narrow down the ${STATE.ag.length} funding agencies.</p>
        </div>
        <div class="ml-auto flex items-center gap-2 sm:gap-3 shrink-0">
          <span id="agCount" class="hidden sm:inline text-xs text-slate-400"></span>
          <button id="agReset" onclick="agResetFilters()" title="Remove all filters and restore the default order"
            class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-300 dark:border-slate-700
                   hover:bg-white dark:hover:bg-slate-800 transition inline-flex items-center gap-1.5">
            <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            Clear filters
          </button>
        </div>
      </div>

function oppCountFor(id){ return STATE.opp.filter(o=>o.agency_id===id).length; }

/* relevance score against the current search term (0 when the box is empty) */
function agScore(a,q){
  if(!q) return 0;
  const name=(a.name||'').toLowerCase(), code=(a.agency_code||'').toLowerCase();
  let s=0;
  if(name===q) s+=100;
  if(name.startsWith(q)) s+=50;
  if(name.includes(q)) s+=25;
  if(code.startsWith(q)) s+=20;
  [a.category,a.country,a.funding_type].forEach(f=>{ if((f||'').toLowerCase().includes(q)) s+=8; });
  return s + Math.min(a.nopp,5);   // agencies that already have data break ties first
}

function agSyncControls(shown){
  const active = agActive();
  const cur = AGF.sort+':'+AGF.dir;
  const known = AG_SORTS.some(([v])=>v===cur);
  const sel = $('#agsort');
  if(sel){
    sel.innerHTML = AG_SORTS.map(([v,l])=>`<option value="${v}" ${cur===v?'selected':''}>${l}</option>`).join('')
      + (known?'':`<option value="${cur}" selected>Column: ${AG_COLS[AGF.sort]||AGF.sort} ${AGF.dir>0?'▲':'▼'}</option>`);
  }
  const count = $('#agCount');
  if(count) count.textContent = `${shown} of ${STATE.ag.length} agencies` + (active.length?` · ${active.length} filter${active.length>1?'s':''} active`:'');
  const reset = $('#agReset');
  if(reset){
    const on = active.length>0 || AGF.sort!==AGF_DEFAULTS.sort || AGF.dir!==AGF_DEFAULTS.dir;
    reset.disabled = !on;
    reset.classList.toggle('opacity-40', !on);
    reset.classList.toggle('cursor-not-allowed', !on);
    reset.classList.toggle('text-brand-700', on);
    reset.classList.toggle('dark:text-brand-300', on);
    reset.classList.toggle('border-brand-300', on);
    reset.classList.toggle('dark:border-brand-500/50', on);
  }
  const wrap = $('#agChipsWrap'), chips = $('#agChips');
  if(wrap && chips){
    wrap.classList.toggle('hidden', active.length===0);
    const label = k => k==='availability' ? (AG_AVAIL.find(([v])=>v===AGF.availability)||[])[1] : AGF[k];
    chips.innerHTML = active.map(k=>`
      <span class="inline-flex items-center gap-1.5 pl-2.5 pr-1.5 py-1 rounded-full text-xs font-medium
                   bg-brand-50 text-brand-700 dark:bg-brand-600/20 dark:text-brand-300 border border-brand-200 dark:border-brand-500/30">
        <span class="text-brand-500/80 dark:text-brand-300/70">${AG_FIELD_LABELS[k]}:</span> ${esc(label(k))}
        <button onclick="agClear('${k}')" title="Remove this filter"
          class="h-4 w-4 grid place-items-center rounded-full hover:bg-brand-200/70 dark:hover:bg-brand-500/30 leading-none">×</button>
      </span>`).join('');
  }
}

function renderAgencies(){
  const q = AGF.q.trim().toLowerCase();
  let rows = STATE.ag.map(a=>{ const n=oppCountFor(a.id); return {...a, nopp:n, status: n>0?'active':'monitored'}; });

  if(q) rows = rows.filter(a=>[a.name,a.agency_code,a.category,a.country,a.funding_type].join(' ').toLowerCase().includes(q));
  if(AGF.country)      rows = rows.filter(a=>a.country===AGF.country);
  if(AGF.category)     rows = rows.filter(a=>a.category===AGF.category);
  if(AGF.funding_type) rows = rows.filter(a=>a.funding_type===AGF.funding_type);
  if(AGF.availability) rows = rows.filter(a=>AGF.availability==='has' ? a.nopp>0 : a.nopp===0);

  if(AGF.sort==='relevance'){
    rows.forEach(a=>a._score=agScore(a,q));
    rows.sort((a,b)=> (b._score-a._score) || a.agency_code.localeCompare(b.agency_code));
  }else{
    rows.sort((a,b)=>{
      const x=a[AGF.sort]??'', y=b[AGF.sort]??'';
      if(typeof x==='number' && typeof y==='number') return (x-y)*AGF.dir;
      return (''+x).localeCompare(''+y)*AGF.dir;
    });
  }

  agSyncControls(rows.length);

  if(!rows.length){
    $('#agTable').innerHTML = `
      <div class="px-6 py-16 text-center">
        <div class="mx-auto h-12 w-12 rounded-full bg-slate-100 dark:bg-slate-800 grid place-items-center mb-4">
          <svg class="h-6 w-6 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M11 18a7 7 0 110-14 7 7 0 010 14zM8.5 8.5l5 5m0-5l-5 5"/></svg>
        </div>
        <div class="font-semibold">No agencies match your selected filters.</div>
        <p class="text-sm text-slate-500 mt-1.5">Try adjusting or clearing your filters.</p>
        <button onclick="agResetFilters()" class="mt-5 px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold transition">
          Clear all filters</button>
      </div>`;
    return;
  }

  const th=(k,l)=>`<th onclick="sortAg('${k}')" class="px-4 py-3 text-left text-[11px] uppercase tracking-wide text-slate-400 cursor-pointer hover:text-slate-600 dark:hover:text-slate-200 select-none whitespace-nowrap">${l}${AGF.sort===k?(AGF.dir>0?' ▲':' ▼'):''}</th>`;
  $('#agTable').innerHTML = `<table class="w-full text-sm">
    <thead class="bg-slate-50 dark:bg-slate-800/60 border-b border-slate-200 dark:border-slate-800">
      <tr>${th('agency_code','Code')}${th('name','Agency')}${th('country','Country')}${th('category','Category')}${th('funding_type','Funding Type')}${th('status','Status')}${th('nopp','Opps')}<th class="px-4 py-3 text-left text-[11px] uppercase tracking-wide text-slate-400">Website</th></tr>
    </thead><tbody>${rows.map(a=>`
      <tr class="border-b border-slate-100 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/40">
        <td class="px-4 py-3 text-slate-400 font-mono text-xs">${esc(a.agency_code)}</td>
        <td class="px-4 py-3 font-semibold">${esc(a.name)}</td>
        <td class="px-4 py-3">${esc(a.country)||'—'}</td>
        <td class="px-4 py-3 text-slate-500">${esc(a.category)||'—'}</td>
        <td class="px-4 py-3 text-slate-500">${esc(a.funding_type)||'—'}</td>
        <td class="px-4 py-3">${a.status==='active'?'<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300">active</span>':'<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-200 text-slate-600 dark:bg-slate-700 dark:text-slate-300">monitored</span>'}</td>
        <td class="px-4 py-3 font-semibold">${a.nopp}</td>
        <td class="px-4 py-3">${linkBtn(a.website,'Visit')}</td>
      </tr>`).join('')}
    </tbody></table>
    <div class="px-4 py-3 text-xs text-slate-400 border-t border-slate-100 dark:border-slate-800 flex flex-wrap gap-x-2">
      <span>Showing <span class="font-semibold text-slate-500 dark:text-slate-300">${rows.length}</span> of ${STATE.ag.length} agencies</span>
      ${AGF.sort==='relevance'&&!q?'<span class="text-amber-600 dark:text-amber-400">· best-match ordering applies once you type in the search box</span>':''}
    </div>`;
}

/* ---------------- Chatbot ---------------- */
function ask(t){ const i=$('#chatq'); if(i){i.value=t; askBot();} }
async function askBot(){
  const q=($('#chatq')||{}).value?.trim(); if(!q) return;
  const out=$('#chatout'); out.classList.remove('hidden'); out.textContent='Thinking…';
  try{ const d=await jget('/chat?q='+encodeURIComponent(q)); out.textContent=d.answer||'(no answer)'; }
  catch(e){ out.textContent='Could not reach the chatbot.'; }
}

/* ---------------- Router ---------------- */
const PAGES={dashboard:pageDashboard,agencies:pageAgencies,opportunities:pageOpportunities,scrapers:pageScrapers,database:pageDatabase,api:pageApi,progress:pageProgress,about:pageAbout};
function render(route){
  clearCharts();
  _currentRoute = route;
  if(STATE.err){ $('#view').innerHTML=`<div class="${card('p-8')} text-center"><div class="text-rose-500 font-semibold mb-1">Could not reach the API</div><div class="text-sm text-slate-500">${esc(STATE.err)}</div></div>`; return; }
  if(!STATE.loaded){ $('#view').innerHTML=`<div class="grid place-items-center py-24 text-slate-400"><div class="animate-pulse">Loading FundRadar…</div></div>`; return; }
  (PAGES[route]||pageDashboard)();
}
function route(){
  const id=(location.hash.replace('#/','')||'dashboard');
  const valid=ROUTES.some(r=>r[0]===id)?id:'dashboard';
  setActive(valid); render(valid);
  if(window.innerWidth<1024){ const sb=$('#sidebar'); if(!sb.classList.contains('-translate-x-full')) toggleSidebar(); }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ---------------- Boot ---------------- */
buildNav();
render('dashboard'); // loading state
loadAll().then(route);
